 <div class="c text-sm"><b>Аукцион</b><div style="opacity:.8">Пул = менеджеры × состав. Общий таймер аукциона (10–30 мин, задаёт хост), 7 с на ход, 5 с после ставки. Пока идёт таймер, покупать может любой с монетами — даже в одиночку по стартовой цене. Trade-in: ставка + игрок в залог (OVR 70–79 → +1, 80–85 → +2, 86+ → +4): перебили — игрок вернётся, выиграли — уйдёт и освободит слот (так можно торговаться и с полным составом). Таймер кончился или все набраны — пустые места займут свободные агенты (64–70). Кнопка «Завершить аукцион (Сохранить бюджет)» выводит вас из торгов: пустые места сразу займут свободные агенты, монеты останутся на трансферный рынок и следующий сезон; когда закончат все — драфт завершается досрочно. Затем аукцион домашних стадионов (старт 1 монета).</div></div>
 <div class="c text-sm"><b>🔋 Усталость</b><div style="opacity:.8">Под карточкой — батарейка энергии (зелёная 60–100%, жёлтая 30–59%, красная ниже 30%). OVR на карточке не меняется, но ниже 50% игрок скрыто слабее на 5, ниже 30% — на 15 и в 2,5 раза чаще травмируется. За матч: низкий прессинг −10–15%, средний −20–25%, высокий −35–45%. На скамейке +40–50% (с Иванычем ещё +10%).</div></div>
 <div class="c text-sm"><b>⚙️ Стиль игры</b><div style="opacity:.8">«Состав» → Options: Автобус, Контратаки, Контроль мяча, Прессинг, Силовой навал, Баланс + интенсивность. Стиль не под состав (например, «Автобус» с топ-атакой и слабой защитой) — −10% к эффективности. Против философии тренера — −5 к скрытой силе. Состав и тренер под стиль — +15% к реализации моментов.</div></div>
 <div class="c text-sm"><b>📦 Тайник</b><div style="opacity:.8">На аукционе всегда один игрок на лот. Раз в 8–10 лотов выставляется тайник: видна только позиция, имя и рейтинг скрыты до удара молотка. Обычные торги по очереди, старт 2 монеты. Кто внутри: 90+ — 5%, 86–89 — 15%, 81–85 — 50%, 71–80 — 20%, до 70 — 10%.</div></div>
 <div class="c text-sm"><b>🥅 Серия пенальти в Кубке</b><div style="opacity:.8">Ничья в кубковом матче — менеджеры сами бьют пенальти: в каждом раунде втайне выбираете, куда бьёт ваш игрок и куда прыгает ваш вратарь (10 с). Не угадал вратарь — почти всегда гол, угадал — чаще сейв. 5 ударов, потом до первой ошибки.</div></div>
 <div class="c text-sm"><b>⏸ Пауза без интернета</b><div style="opacity:.8">Если у хоста пропал интернет (или он свернул игру), игра у всех встаёт на паузу: таймеры замирают и продолжаются с того же места, когда хост вернётся.</div></div>
 <div class="c text-sm"><b>📊 Досье игрока</b><div style="opacity:.8">Нажмите на карточку игрока (на поле — дважды): фото, клуб, стиль, энергия и радар PAC / SHO / PAS / DRI / DEF / PHY.</div></div>
