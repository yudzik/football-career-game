.sl{position:absolute;transform:translate(-50%,50%);z-index:2}

.pc .nm{position:absolute;left:0;right:0;top:46px;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;padding:0 2px;font-size:9px}

function menuV(){return`<div class="ov"><div><h2>Меню</h2><div class="c"><b>Комната ${esc(CODE)}</b>${isHost?' · вы хост':''} · сезон ${S.season}<button class="b" onclick="shareLink(this)">📨 Пригласить по ссылке</button></div>
 ${isHost?`<div class="c text-sm"><b>Режим матчей</b><div class="seg mt-2"><button class="${S.cfg.mode!='q'?'on':''}" onclick="send({a:'mode',v:'i'})">⚔️ Моменты</button><button class="${S.cfg.mode=='q'?'on':''}" onclick="send({a:'mode',v:'q'})">📺 Матч-центр</button></div></div>`:`<div class="c text-sm">Режим матчей: <b>${S.cfg.mode=='q'?'📺 матч-центр':'⚔️ интерактивные моменты'}</b></div>`}
 ${cabinet()}${hallV()}
 <div class="c text-sm"><b>Дуэли</b><div style="opacity:.8">3–5 ситуаций за матч, 12 секунд на выбор. Шанс гола = база ситуации (1 на 1 — 60%, удар с 22 м — 25%, пенальти — 78%…) + разница рейтингов × 1.5% − 30%, если защита угадала. Защищающийся может 1 раз за матч запросить VAR: 50% — гол отменят.</div></div>
 <div class="c text-sm"><b>Аукцион</b><div style="opacity:.8">Пул = менеджеры × состав. Общий таймер аукциона (10–30 мин, задаёт хост), 7 с на ход, 5 с после ставки. Пока идёт таймер, покупать может любой с монетами — даже в одиночку по стартовой цене. Trade-in: ставка + игрок в залог (OVR 70–79 → +1, 80–85 → +2, 86+ → +4): перебили — игрок вернётся, выиграли — уйдёт и освободит слот (так можно торговаться и с полным составом). Таймер кончился или все набраны — пустые места займут свободные агенты (64–70). Затем аукцион домашних стадионов (старт 1 монета).</div></div>
 <div class="c text-sm"><b>📺 Матч-центр</b><div style="opacity:.8">В режиме «Матч-центр» тур идёт вживую: часы 1'→90' и 3–5 минут добавленного времени (~0,1 с на минуту), голы с ассистентами, карточки, сейвы, штанги, травмы и замены. «Пропустить до конца» сразу показывает счёт; таблица обновляется по финальному свистку.</div></div>
 <div class="c text-sm"><b>🏷 Трансферный рынок</b><div style="opacity:.8">Между турами и в межсезонье: выставьте игрока за свою цену (3, 5, 8… монет) — любой менеджер купит его в один клик, монеты сразу уходят продавцу. Снять с рынка можно в любой момент до покупки. Лимит состава — заявка + 3 запасных места.</div></div>
 <div class="c text-sm"><b>💎 Межсезонный мини-аукцион</b><div style="opacity:.8">Лоты выпадают как в гаче: 90+ ≈4% (не больше одной звезды), 84–89 ≈17%, 78–83 ≈42%, 70–77 ≈33%.</div></div>
 <div class="c text-sm"><b>Стадионы</b>${STAD.map(s=>`<div style="opacity:.85">🏟 <b>${esc(s.n)}</b> — ${esc(s.d)}${S.M.find(m=>m.stad===s.i)?' · <span class="text-yellow-400">'+esc(S.M.find(m=>m.stad===s.i).club)+'</span>':''}</div>`).join('')}</div>
 <div class="c text-sm"><b>Позиции и сыгранность</b><div style="opacity:.8">Основная позиция — 100%, вторичная −4, чужая −30, вратарь в поле / полевой в воротах — 30. Сыгранность ◆ 0–3 на игрока, до 33 на команду, даёт до +7% силы.</div></div>
 ${btn('Закрыть',"MENU=false;R()",'v')}${btn('Выйти из комнаты',"MENU=false;leave()",'r')}${credits()}</div></div>`}
function topV(){const on=NET&&NET.up;return`<div class="top"><span class="dot" style="background:${on?'#10b981':'#ef4444'}"></span><span style="flex:1">Комната <b>${esc(CODE)}</b>${isHost?' · хост':''} · ${on?'онлайн':'нет связи…'}</span><button onclick="MENU=true;R()">☰ Меню</button></div>${hostAway()?'<div class="warn">Хост не в сети — игра продолжится, когда он вернётся во вкладку с игрой.</div>':''}`}
function R(){const a=$('app'),n=$('nav'),ae=document.activeElement,fid=ae&&ae.id&&(ae.tagName=='INPUT'||ae.tagName=='SELECT')?ae.id:null,fv=fid?ae.value:null;
 const tz=TOAST?`<div class="toast">${esc(TOAST)}</div>`:'';
 if(!S){n.innerHTML='';a.innerHTML=homeV()+tz}
 else{let h='';const main=S.ph=='main'&&!S.live&&!S.mc;
 if(!me()){n.innerHTML='';a.innerHTML=topV()+(S.ph=='lobby'?'<div class="c text-center mt-4">Входим в лобби…</div>':`<div class="c text-center mt-4">Игра в комнате ${esc(CODE)} уже началась без вас.${btn('На главную','leave()','g')}</div>`)+(MENU?menuV():'')+tz}
 else{if(S.ph=='lobby')h=lobbyV();else if(['cauc','auc','oauc','sauc'].includes(S.ph))h=aucV();else if(S.ph=='sum')h=sumV();else if(S.ph=='off')h=offV();else if(S.live)h=liveV();else if(S.mc)h=mcV();else h=({sq:sqV,rd:rdV,tab:tabV,mk:mkV,tr:trV}[TAB]||sqV)();
 a.innerHTML=topV()+h+(FMO&&['cauc','auc','main','oauc'].includes(S.ph)&&!S.live?fmV():'')+(main||S.ph=='off'?offerV()+(BUYO!=null?relV():''):'')+(MENU?menuV():'')+tz;
 n.innerHTML=main?`<div class="nav">${[['sq','📋','Состав'],['rd','⚽',curIt().t=='C'?'Кубок':'Тур'],['tab','📊','Таблица'],['mk','🏷','Рынок'+(S.mk.filter(x=>x.pid!=ME).length?' ·'+S.mk.filter(x=>x.pid!=ME).length:'')],['tr','🔁','Обмен']].map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';SEL=null;R()"><div class="text-lg">${t[1]}</div>${t[2]}</button>`).join('')}</div>`:''}}
 if(fid){const el=$(fid);if(el&&el!==document.activeElement){if(fv!=null&&el.tagName=='INPUT')el.value=fv;try{el.focus({preventScroll:true})}catch(e){}}}}

 if(S.aucEnd&&$('gt')){const l=Math.max(0,S.aucEnd-n),s=Math.ceil(l/1000);$('gt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('gt').style.color=s<=60?'#ef4444':''}
 if(S.au&&!S.au.sold&&$('tm')){const u=S.au,l=Math.max(0,u.end-n),s=Math.ceil(l/1000);$('tm').textContent=s+' с';$('tm').style.color=s<=2?'#ef4444':'';$('bar').style.width=Math.min(100,l/TFIRST*100)+'%';if(s<=3&&s>0&&s!=TKS&&S.au.turn==ME)sndTick();TKS=s}
 if(S.ph=='off'&&S.offEnd&&$('ot')){const l=Math.max(0,S.offEnd-n),s=Math.ceil(l/1000);$('ot').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('ot').style.color=s<=15?'#ef4444':'';$('obar').style.width=Math.min(100,l/XFER*100)+'%'}
 if(S.ph=='main'&&!L&&S.prepEnd&&$('pt')){const l=Math.max(0,S.prepEnd-n),s=Math.ceil(l/1000);$('pt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('pt').style.color=s<=10?'#ef4444':'';$('pbar').style.width=Math.min(100,l/XFER*100)+'%'}
 if(L&&$('lt')){const tot=L.rev?REVEAL:DUEL,l=Math.max(0,(L.rev?L.revEnd:L.end)-n),s=Math.ceil(l/1000);$('lt').textContent=L.rev?'дальше через '+s+' с':s+' с';$('lt').style.color=!L.rev&&s<=3?'#ef4444':'';$('lbar').style.width=Math.min(100,l/tot*100)+'%';if(!L.rev&&s<=3&&s>0&&s!=TKS&&myMatch())sndTick();TKS=s}},200);

 const mx=Math.max(...c.res.map(r=>90+r.add)),k=S.si+'';if(MCG.k!=k){MCG={k,g:0,w:0,f:0};if(cm<3)tone(1800,.5,'sine',.15)}

 if(cm>mx&&!MCG.f){MCG.f=1;if(MCSK!==S.si){tone(1800,.35,'sine',.15);tone(1800,.35,'sine',.15,.45);tone(1800,.9,'sine',.15,.9)}}},100);
