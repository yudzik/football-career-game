 <div class="text-xs mt-1" style="opacity:.75">🧑‍💼 ${co?esc(co.n)+' '+flag(co.nat):'тренер не выбран'} · ВРТ ${byG[0]} · ЗАЩ ${byG[1]} · ПЗ ${byG[2]} · АТК ${byG[3]}</div>
 <div class="flex items-center gap-2 mt-2"><button class="tag on" onclick="FMO=true;R()">${m.fm} ▾</button><span class="text-xs" style="opacity:.6">закрытые позиции схемы:</span></div>
 <div class="mt-1">${sl.map((s,i)=>`<span class="cov ${c[i]?'y':''}">${PN[s]}</span>`).join('')}</div>
 ${m.sq.length?`<div class="mt-2 text-xs" style="line-height:1.7">${m.sq.map(id=>pl(id)).sort((a,b)=>grp(a.p)-grp(b.p)||b.o-a.o).map(p=>`<span class="tag" style="border-left:3px solid ${rc(p.o)}">${PN[p.p]}${p.s?'/'+PN[p.s]:''} ${esc(short(p.n))} <b>${p.o}</b></span>`).join('')}</div>`:''}</div>`}
function aucV(){const u=S.au,m=me(),isC=S.ph=='cauc';if(!u)return`<h2>${isC?'Аукцион тренеров':'Драфт игроков'}</h2><div class="c text-center">Готовим лот…</div>${miniSquad(m)}`;
 const ld=u.ld?S.M[mi(u.ld)]:null,my=u.turn==ME&&!u.sold,inLot=u.order.includes(ME),minB=u.bid?u.bid+1:u.st;
 const whyOut=isC?(m.coach!=null?'у вас уже есть тренер':'не хватает монет'):(m.sq.length>=S.cfg.sq?'состав укомплектован':'не хватает монет на стартовую цену');
 return`<div class="flex justify-between text-sm"><b class="text-yellow-400">${isC?'🧑‍💼 Аукцион тренеров':'🔨 Драфт игроков'}</b><span style="opacity:.7">Лот #${S.lot}${isC?'':' · в пуле '+S.pool.length}</span></div>
 ${u.k=='c'?coachCard(u.id):card(u.id)}
 <div class="c text-center"><div class="flex justify-between text-xs" style="opacity:.7"><span>Старт: ${u.st} 💰</span><span>ТЕКУЩАЯ СТАВКА</span><span>Ваши: ${m.coins} 💰</span></div><div class="text-4xl font-black text-yellow-400">${u.bid||'—'}</div><div>${ld?(ld.pid==ME?'✅ Вы лидируете':'Лидер: <b>'+esc(ld.n)+'</b> · '+esc(ld.club)):'Ставок пока нет'}</div>
 ${u.sold?'':`<div class="mt-1 text-sm">${my?'<b class="text-emerald-400">🎯 Ваш ход!</b>':'Ходит: <b>'+esc((S.M[mi(u.turn)]||{}).n)+'</b>'} · <span id="tm" class="font-black">--</span></div><div class="bar mt-1"><div id="bar" style="width:100%"></div></div>`}</div>
 <div class="mt-1">${u.order.map(p=>{const x=S.M[mi(p)];return`<span class="tag ${p==u.turn&&!u.sold?'on':p==u.ld?'ld':u.pass.includes(p)?'off':''}">${p==ME?'★ ':''}${esc(x?x.n:'?')}</span>`}).join('')}</div>
 ${u.sold?`<div class="c text-center text-lg text-yellow-400">🔨 ${esc(u.sold)}</div>`:my?`<div class="grid grid-cols-3 gap-2">${(u.bid?[1,2,5].map(x=>[u.bid+x,'+'+x]):[[u.st,'Старт '+u.st],[u.st+1,u.st+1+''],[u.st+3,u.st+3+'']]).map(([v,t])=>`<button class="b" style="margin:0" ${v>m.coins?'disabled':''} onclick="send({a:'bid',x:${v}})">${t}</button>`).join('')}</div><div class="flex gap-2 mt-2"><input id="bx" type="number" inputmode="numeric" placeholder="Своя ставка (от ${minB})" style="margin:0"><button class="b v" style="margin:0;width:auto;padding:0 20px" onclick="const v=+$('bx').value;if(v>=${minB}&&v<=${m.coins})send({a:'bid',x:v});else toast('Ставка от ${minB} до ${m.coins}')">OK</button></div>${btn('Пас',"send({a:'pass'})",'g')}`:inLot?'':`<div class="c text-center text-sm" style="opacity:.7">Вы не участвуете в этом лоте: ${whyOut}</div>`}
 ${miniSquad(m)}
 ${isHost?btn(isC?'Завершить аукцион тренеров (остальным — случайные)':'Завершить драфт (остальное — свободные агенты)',`if(confirm('Завершить этап досрочно?'))send({a:'endauc'})`,'g'):''}`}
const ovr=m=>{const v=slots(m.fm).map((s,i)=>m.xi[i]!=null?eff(pl(m.xi[i]),s):30);return Math.round(v.reduce((a,b)=>a+b,0)/v.length)};
function sqV(){const m=me(),F=rows(m.fm),ch=chemOf(m),o=ovr(m),st=Math.max(1,Math.min(5,Math.round((o-60)/6))),co=coachOf(m);let k=0;
 const sl=F.map((r,i)=>[...r].map((s,j)=>{const idx=k++,x=(j+1)*100/(r.length+1),y=7+i*(84/(F.length-1));return`<div class="sl ${SEL&&SEL.t=='x'&&SEL.i==idx?'sel':''}" style="left:${x}%;bottom:${y}%" onclick="pickX(${idx})">${gc(m.xi[idx],s,ch.per[idx])}</div>`}).join('')).join('');
 const bench=m.sq.filter(id=>!m.xi.includes(id));
 return`<div class="flex justify-between items-center text-sm"><button class="px-3 py-2 rounded-lg font-bold" style="background:#222b2f" onclick="FMO=true;R()">${m.fm} ▾</button><div class="text-center"><div class="text-yellow-400">${'★'.repeat(st)}${'☆'.repeat(5-st)}</div><b>OVR ${o}</b></div><div class="text-center text-emerald-400"><div>◆ Сыгр.</div><b>${ch.tot}/33</b></div><div>💰 <b>${m.coins}</b></div></div>
 <div class="pitch mt-2">${sl}${co?`<div class="c" style="position:absolute;left:5px;top:4px;z-index:3;width:84px;margin:0;padding:4px;text-align:center;background:#000b"><div class="text-2xl">${flag(co.nat)}</div><b class="text-xs">${esc(co.n)}</b><div class="text-[9px] text-emerald-300">${esc(co.perk)}</div><div class="flex justify-center mt-1">${crest(m.club)}</div></div>`:''}</div>
 <div class="text-[11px] mt-2" style="opacity:.7">Рейтинг: <span style="color:#fbbf24">коричневый</span> — вторичная позиция (−4), <span style="color:#f87171">красный</span> — чужая позиция (−30). ◆ — сыгранность игрока: клуб, нация, лига, тренер.</div>
 <div class="text-sm mt-2 font-bold">Скамейка (${bench.length})</div><div class="flex gap-2 overflow-x-auto py-2">${bench.map(id=>`<div class="${SEL&&SEL.t=='b'&&SEL.id==id?'sel':''}" onclick="pickB(${id})" style="flex:none">${gc(id)}</div>`).join('')}</div><div class="text-xs opacity-60">Нажмите игрока основы, затем запасного (или другого игрока основы) — они поменяются местами.</div>`}
function pickX(i){const m=me();if(!SEL)SEL={t:'x',i};else if(SEL.t=='x'){const x=m.xi.slice();[x[i],x[SEL.i]]=[x[SEL.i],x[i]];SEL=null;send({a:'xi',xi:x})}else{const x=m.xi.slice();x[i]=SEL.id;SEL=null;if(pl(x[i]).out)return toast('Этот игрок травмирован'),R();send({a:'xi',xi:x})}R()}
function pickB(id){const m=me();if(SEL&&SEL.t=='x'){if(pl(id).out){SEL=null;toast('Этот игрок травмирован');return}const x=m.xi.slice();x[SEL.i]=id;SEL=null;send({a:'xi',xi:x})}else SEL={t:'b',id};R()}
function fmV(){const m=me();return`<div class="ov"><div><h2>Выбор схемы</h2><div class="grid grid-cols-3 gap-2">${Object.keys(FM).map(f=>`<button class="c" style="${m&&m.fm==f?'border-color:#d4a72c':''}" onclick="FMO=false;send({a:'fm',f:'${f}'})"><div class="mini">${dots(f).map(d=>`<i style="left:${d[0]}%;bottom:${d[1]}%"></i>`).join('')}</div><b class="text-sm">${f}</b><div class="text-[10px]" style="opacity:.6">${FM[f][0]}</div></button>`).join('')}</div>${btn('Закрыть',"FMO=false;R()",'g')}</div></div>`}
const table=()=>S.M.map((m,i)=>({m,i,p:m.st[1]*3+m.st[2]})).sort((a,b)=>b.p-a.p||(b.m.st[4]-b.m.st[5])-(a.m.st[4]-a.m.st[5])||b.m.st[4]-a.m.st[4]);
function tabV(){return`<h2>Турнирная таблица</h2><div class="c text-xs overflow-x-auto"><table class="w-full" style="min-width:330px"><tr class="opacity-60"><td>#</td><td></td><td>Клуб</td><td>И</td><td>В</td><td>Н</td><td>П</td><td>З</td><td>П</td><td>РМ</td><td>О</td></tr>${table().map((x,k)=>{const s=x.m.st;return`<tr class="${x.m.pid==ME?'text-yellow-300':''}"><td>${k+1}</td><td>${crest(x.m.club)}</td><td>${esc(x.m.club)}</td><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${s[5]}</td><td>${s[4]-s[5]}</td><td><b>${x.p}</b></td></tr>`}).join('')}</table></div>
 ${(()=>{const P=S.M.flatMap(m=>m.sq.map(id=>({p:S.P[id],c:m.club}))),top=(k,f)=>P.filter(x=>x.p[k]>0&&(!f||x.p.p=='G')).sort((a,b)=>b.p[k]-a.p[k]).slice(0,5).map(x=>`<div class="flex justify-between"><span>${flag(x.p.nat)} ${esc(x.p.n)} <span class="opacity-60">${esc(x.c)}</span></span><b>${x.p[k]}</b></div>`).join('')||'—';return`<div class="c"><b>👟 Золотая бутса</b>${top('gl')}</div><div class="c"><b>🎯 Ассистенты</b>${top('as')}</div><div class="c"><b>🧤 Лучшие вратари (сухие матчи)</b>${top('cs',1)}</div>`})()}`}
function rdV(){const fin=S.ph=='end',ch=table()[0],m=me(),rdy=S.ready.includes(ME);
 return`${fin?`<div class="c text-center"><div class="text-6xl">🏆</div><h2>Чемпион: ${esc(ch.m.club)}</h2><b>${esc(ch.m.n)}</b></div>`:`<h2>Тур ${S.rd+1} из ${S.fx.length}</h2>
 <div class="c text-center"><div class="text-xs" style="opacity:.6">ПОДГОТОВКА К ТУРУ</div><div id="pt" class="text-4xl font-black">--</div><div class="bar mt-1"><div id="pbar" style="width:100%"></div></div>
 <div class="mt-2">${S.M.map(x=>`<span class="tag ${S.ready.includes(x.pid)?'ld':''}">${S.ready.includes(x.pid)?'✅':'⏳'} ${esc(x.n)}</span>`).join('')}</div>
 <button class="b ${rdy?'g':'v'}" style="font-size:18px;padding:16px" onclick="send({a:'ready'})">${rdy?'⏸ Отменить готовность':'✅ Я готов к матчу'}</button>
 ${isHost?btn('⚽ Начать тур сейчас (хост)',"send({a:'sim'})",'g'):''}<div class="text-xs mt-2" style="opacity:.6">Тур сыграется, когда все нажмут «Готов» или закончится таймер. Пока идёт подготовка — меняйте состав, схему и делайте обмены.</div></div>
 ${S.fx[S.rd].map(([h,a])=>`<div class="c flex items-center justify-between text-sm"><span>${crest(S.M[h].club)} ${esc(S.M[h].club)}</span><b>vs</b><span>${esc(S.M[a].club)} ${crest(S.M[a].club)}</span></div>`).join('')}
 ${S.evs.length?`<h2>События перед туром</h2>${S.evs.map(e=>`<div class="c text-sm ${e.includes('🚑')?'warn bad':''}">${esc(e)}</div>`).join('')}`:''}`}
 ${S.last.length?`<h2>Итоги ${fin?'последнего ':'прошлого '}тура</h2>${S.last.map(r=>`<details class="c"><summary class="flex justify-between"><span>${esc(S.M[r.h].club)}</span><b class="text-yellow-400">${r.ga}:${r.gb}</b><span>${esc(S.M[r.a].club)}</span></summary><div class="text-xs mt-2">${r.ev.map(e=>`<div>${esc(e)}</div>`).join('')}</div></details>`).join('')}`:''}`}
function trV(){const m=me(),o=S.M.filter(x=>x.pid!=ME);if(!o.length)return'';TR.f=Math.min(TR.f,o.length-1);const f=o[TR.f],opt=(a,v)=>a.map(id=>`<option value="${id}" ${id==v?'selected':''}>${esc(pl(id).n)} (${pl(id).o} ${PN[pl(id).p]}${pl(id).out?' 🚑':''})</option>`).join('');if(!m.sq.includes(+TR.g))TR.g=m.sq[0];if(!f.sq.includes(+TR.r))TR.r=f.sq[0];
 return`<h2>Обмен с друзьями</h2><div class="c">Клуб<select onchange="TR.f=+this.value;R()">${o.map((x,i)=>`<option value="${i}" ${i==TR.f?'selected':''}>${esc(x.club)} · ${esc(x.n)}</option>`).join('')}</select>Отдаю<select onchange="TR.g=+this.value">${opt(m.sq,+TR.g)}</select>Получаю<select onchange="TR.r=+this.value">${opt(f.sq,+TR.r)}</select>Моя доплата, монет<input type="number" min="0" value="${TR.c}" oninput="TR.c=+this.value||0">${btn('Отправить предложение',"send({a:'offer',to:'"+f.pid+"',g:+TR.g,r:+TR.r,c:TR.c})")}</div>${S.offers.filter(x=>x.from==ME).map(x=>`<div class="c text-sm">⏳ Ждёт ответа: ${esc(pl(x.g).n)}${x.c?' + '+x.c+'💰':''} за ${esc(pl(x.r).n)}</div>`).join('')}`}
function offerV(){const x=S.offers.find(o=>o.to==ME);if(!x)return'';const A=S.M[mi(x.from)];return`<div class="ov"><div><h2>Предложение обмена</h2><div class="c"><b>${esc(A.n)}</b> (${esc(A.club)}) отдаёт:${card(x.g)}${x.c?`<div class="text-center">+ ${x.c} 💰</div>`:''}за вашего:${card(x.r)}</div>${btn('Принять',`send({a:'resp',id:'${x.id}',ok:1})`,'v')}${btn('Отклонить',`send({a:'resp',id:'${x.id}',ok:0})`,'g')}</div></div>`}
function menuV(){return`<div class="ov"><div><h2>Меню</h2><div class="c"><b>Комната ${esc(CODE)}</b>${isHost?' · вы хост':''}<button class="b" onclick="shareLink(this)">📨 Пригласить по ссылке</button></div>
 <div class="c text-sm"><b>Правила позиций</b><div style="opacity:.8">Основная позиция — 100% рейтинга, вторичная — −4, чужая — −30 (например 82 → 52). Вратарь в поле или полевой в воротах — 30.</div></div>
 <div class="c text-sm"><b>Сыгранность ◆ 0–3 на игрока, 33 на команду</b><div style="opacity:.8">Только игроки на своей (основной/вторичной) позиции. Клуб: 2/5/8 игроков → +1/+2/+3, нация: 2/5/8, лига: 3/5/8. Тренер: +1 игрокам своей нации или лиги. Сыгранность даёт множитель силы команды до +7%.</div></div>
 <div class="c text-sm"><b>Аукцион</b><div style="opacity:.8">Ход по кругу: перебить или пас (15 с на ход). Старт: 89+ → 5, 85–88 → 4, 81–84 → 3, 76–80 → 2, ниже → 1. Первый ход следующего лота — у следующего после победителя.</div></div>
 ${btn('Закрыть',"MENU=false;R()",'v')}${btn('Выйти из комнаты',"MENU=false;leave()",'r')}${credits()}</div></div>`}
function topV(){const on=NET&&NET.up;return`<div class="top"><span class="dot" style="background:${on?'#10b981':'#ef4444'}"></span><span style="flex:1">Комната <b>${esc(CODE)}</b>${isHost?' · хост':''} · ${on?'онлайн':'нет связи…'}</span><button onclick="MENU=true;R()">☰ Меню</button></div>${hostAway()?'<div class="warn">Хост не в сети — игра продолжится, когда он вернётся во вкладку с игрой.</div>':''}`}
function R(){const a=$('app'),n=$('nav'),ae=document.activeElement,fid=ae&&ae.id&&(ae.tagName=='INPUT'||ae.tagName=='SELECT')?ae.id:null,fv=fid?ae.value:null;
 const tz=TOAST?`<div class="toast">${esc(TOAST)}</div>`:'';

 else{let h='';const main=S.ph=='main'||S.ph=='end';
 if(!me()){n.innerHTML='';a.innerHTML=topV()+(S.ph=='lobby'?'<div class="c text-center mt-4">Входим в лобби…</div>':`<div class="c text-center mt-4">Игра в комнате ${esc(CODE)} уже началась без вас.${btn('На главную','leave()','g')}</div>`)+(MENU?menuV():'')+tz}
 else{if(S.ph=='lobby')h=lobbyV();else if(S.ph=='cauc'||S.ph=='auc')h=aucV();else h={sq:sqV,rd:rdV,tab:tabV,tr:trV}[TAB]();
 a.innerHTML=topV()+h+(FMO&&S.ph!='lobby'&&S.ph!='end'?fmV():'')+(main?offerV():'')+(MENU?menuV():'')+tz;
 n.innerHTML=main?`<div class="nav">${[['sq','📋','Состав'],['rd','⚽',S.ph=='end'?'Итоги':'Тур'],['tab','📊','Таблица'],['tr','🔁','Обмен']].map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';SEL=null;R()"><div class="text-lg">${t[1]}</div>${t[2]}</button>`).join('')}</div>`:''}}
 if(fid){const el=$(fid);if(el&&el!==document.activeElement){if(fv!=null&&el.tagName=='INPUT')el.value=fv;try{el.focus({preventScroll:true})}catch(e){}}}}
setInterval(()=>{if(!S)return;const n=Date.now();
 if(S.au&&!S.au.sold&&$('tm')){const l=Math.max(0,S.au.end-n),s=Math.ceil(l/1000);$('tm').textContent=s+' с';$('tm').style.color=s<=3?'#ef4444':'';$('bar').style.width=Math.min(100,l/TURN*100)+'%';if(s<=3&&s>0&&s!=TKS&&S.au.turn==ME)sndTick();TKS=s}
 if(S.ph=='main'&&S.prepEnd&&$('pt')){const l=Math.max(0,S.prepEnd-n),s=Math.ceil(l/1000);$('pt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('pt').style.color=s<=10?'#ef4444':'';$('pbar').style.width=Math.min(100,l/(S.cfg.prep*10))+'%'}},200);
setInterval(()=>{if(S&&!isHost){const w=!!hostAway();if(w!=HBW){HBW=w;R()}}},1000);
R();
