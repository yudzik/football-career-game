/* ===== start screens (v27): night-stadium EA-FC look, chamfered glass panels, neon + gold ===== */
:root{--neo:#00FF87;--neo-g:rgba(0,255,135,.45);--gold:linear-gradient(135deg,#FFE066 0%,#D4AF37 50%,#AA7C11 100%);--glass:rgba(12,22,30,.85)}
#app.hmon{max-width:440px;padding:0}
.hm{position:relative;min-height:100dvh;display:flex;flex-direction:column;gap:clamp(8px,1.5dvh,14px);padding:calc(10px + env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));color:#eafff5}
.hm button{color:inherit}.hm button:disabled{opacity:.45}
.ru,.hm .lg1,.hm .lg2,.hnm,.hlv,.hx b,.hrl,.hrc,.hbg,.hgold,.hstrip .hsc,.hback,.h2t,.hmc b,.hmc small,.htabs button,.hpl,.hps b,.hmt b,.hmh b,.hst i,.hci,.hsa{font-family:RussoFD,'Russo One',Impact,'Arial Black',system-ui,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
/* background: night stadium */
.hmbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
 radial-gradient(60% 34% at 50% 30%,rgba(0,255,135,.16),transparent 70%),
 radial-gradient(45% 22% at 8% 6%,rgba(190,255,225,.20),transparent 70%),
 radial-gradient(45% 22% at 92% 6%,rgba(190,255,225,.20),transparent 70%),
 radial-gradient(130% 55% at 50% 112%,rgba(0,150,75,.38),transparent 62%),
 linear-gradient(180deg,#081219 0%,#070B12 46%,#05110c 100%)}
.hmbg:before{content:'';position:absolute;left:0;right:0;top:2%;height:18%;background:radial-gradient(circle,rgba(235,255,246,.95) 0 1.3px,transparent 2.3px) 0 0/12px 9px;
 -webkit-mask-image:radial-gradient(26% 48% at 10% 45%,#000,transparent 72%),radial-gradient(26% 48% at 90% 45%,#000,transparent 72%);mask-image:radial-gradient(26% 48% at 10% 45%,#000,transparent 72%),radial-gradient(26% 48% at 90% 45%,#000,transparent 72%)}
.hmbg:after{content:'';position:absolute;left:0;right:0;top:16%;bottom:28%;opacity:.55;background:radial-gradient(circle,rgba(160,200,190,.35) 0 .8px,transparent 1.4px) 0 0/6px 5px,repeating-linear-gradient(176deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);
 -webkit-mask-image:linear-gradient(180deg,transparent,#000 25%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 25%,#000 70%,transparent)}
.hmbg i{position:absolute;width:38vmax;height:16vmax;background:linear-gradient(90deg,rgba(0,255,135,.0),rgba(0,255,135,.32));clip-path:polygon(0 100%,100% 0,100% 18%,8% 100%);opacity:.55}
.hmbg i:nth-child(1){left:-12vmax;top:34%;transform:scaleX(-1) rotate(8deg)}.hmbg i:nth-child(2){right:-12vmax;top:30%}.hmbg i:nth-child(3){right:-8vmax;bottom:6%;opacity:.35}
/* chamfered panel with a glowing border (clip-path on pseudo layers, glow on the element) */
.oc{position:relative;isolation:isolate;--k:14px;--bw:1.5px;--bc:rgba(0,255,135,.38);--fill:var(--glass);
 --cp:polygon(var(--k) 0,calc(100% - var(--k)) 0,100% var(--k),100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,var(--k) 100%,0 calc(100% - var(--k)),0 var(--k))}
.oc:before{content:'';position:absolute;inset:0;z-index:-2;clip-path:var(--cp);-webkit-clip-path:var(--cp);background:var(--bc)}
.oc:after{content:'';position:absolute;inset:var(--bw);z-index:-1;clip-path:var(--cp);-webkit-clip-path:var(--cp);background:var(--fill)}
.glow{filter:drop-shadow(0 0 10px var(--neo-g))}
/* top bar */
.htop{display:flex;align-items:center;gap:8px}
.hpro{flex:1;min-width:0;max-width:64%;display:flex;align-items:center;gap:10px;padding:6px 30px 6px 6px;--k:12px;--cp:polygon(12px 0,100% 0,calc(100% - 22px) 100%,0 100%,0 12px);--bc:linear-gradient(90deg,rgba(0,255,135,.65),rgba(0,255,135,.15) 70%,rgba(0,255,135,.6));--fill:linear-gradient(90deg,rgba(8,20,24,.96),rgba(10,24,30,.88))}
.hav{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--neo);background:radial-gradient(circle at 50% 35%,#12302a,#060d10 70%);box-shadow:0 0 12px var(--neo-g),inset 0 0 8px rgba(0,255,135,.25);color:#f5c542}.hav svg{width:26px;height:26px;filter:drop-shadow(0 1px 0 #7a5a06)}

 <div class="pitch fut mt-2">${sl}</div>${stadOf(m)?(()=>{const s=stadOf(m),u=img('s'+s.i);return`<div class="c flex items-center gap-2" style="padding:6px 10px">${u?`<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" style="width:72px;height:44px;object-fit:cover;border-radius:8px;border:2px solid #d4a72c;flex:none" onerror="this.remove()">`:`<div style="width:72px;height:44px;border-radius:8px;border:2px solid #d4a72c;overflow:hidden;flex:none">${stadSVG}</div>`}<div class="flex-1 text-xs" style="min-width:0"><b class="text-sm">🏟 ${esc(s.n)}</b> <span style="opacity:.6">домашний стадион · 👥 ${esc(s.cap)}</span><div class="text-emerald-400">${esc(s.d)}</div></div></div>`})():''}${tabs}${SQT=='opts'?opts:subs}`}

  const ko=T.res.filter(x=>typeof x.d!='number');return`<div class="c"><b>${EUN[T.key]}</b>${T.win!=null?` <span class="troph">🏆 ${cn(T.win)}</span>`:''}${T.G.map((g,j)=>`${T.G.length>1?`<div class="text-[11px] mt-2" style="opacity:.6">Группа ${'AB'[j]}</div>`:''}${tbl(g)}`).join('')}${ko.length?`<div class="text-xs mt-2">${ko.map(x=>`<div>${x.d=='sf'?'½':'Финал'}: ${cn(x.h)} <b class="text-yellow-400">${x.ga}:${x.gb}${x.pen?` (пен ${x.pen[0]}:${x.pen[1]})`:''}</b> ${cn(x.a)}</div>`).join('')}</div>`:''}</div>`}).join('')}

// 2D tactical mini-pitch for a duel: green = attack, red = defence, ball with its direction, duelists labelled
function miniPitch(c,atkM,defM){const L=SIT[c.k].L,A=pl(c.ap),D=pl(c.dp),av=eff(A,slotOf(atkM,c.ap)),dv=eff(D,slotOf(defM,c.dp)),lab=(x,y,t,col)=>`<text x="${Math.min(84,Math.max(16,x))}" y="${y}" font-size="3.6" font-weight="800" text-anchor="middle" fill="${col}" stroke="#000" stroke-width=".5" paint-order="stroke">${esc(t)}</text>`;
 let s=`<svg viewBox="0 0 100 48" class="mp"><defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3 0 6z" fill="#fde047"/></marker></defs><rect width="100" height="48" fill="#11713f"/>${[0,1,2,3,4,5].map(i=>`<rect x="0" y="${i*8}" width="100" height="4" fill="#0f6438"/>`).join('')}<g fill="none" stroke="#ffffff66" stroke-width=".5"><rect x="20" y="0.3" width="60" height="18"/><rect x="36" y="0.3" width="28" height="6"/><path d="M40 18A11 11 0 0 0 60 18"/><circle cx="50" cy="12" r=".6" fill="#fff"/></g><rect x="43" y="-1" width="14" height="2" fill="#fff"/>`;
 L.D.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i==L.di?2.3:1.8}" fill="#ef4444" stroke="${i==L.di?'#fff':'#7f1d1d'}" stroke-width="${i==L.di?.7:.4}"/>`);
 L.A.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i==L.ai?2.3:1.8}" fill="#22c55e" stroke="${i==L.ai?'#fff':'#14532d'}" stroke-width="${i==L.ai?.7:.4}"/>`);
 s+=`<line x1="${L.ball[0]}" y1="${L.ball[1]}" x2="${L.to[0]}" y2="${L.to[1]}" stroke="#fde047" stroke-width=".7" stroke-dasharray="1.5 1" marker-end="url(#ar)"/><circle cx="${L.ball[0]}" cy="${L.ball[1]}" r="1.2" fill="#fff" stroke="#000" stroke-width=".3"/>`;
 const a=L.A[L.ai],d=L.D[L.di],up=a[1]>d[1];s+=lab(a[0],up?a[1]+6:a[1]-3.2,short(A.n)+' '+av,'#bbf7d0')+lab(d[0],up&&d[1]>9?d[1]-3.2:d[1]+6,short(D.n)+' '+dv,'#fecaca');return s+'</svg>'}

function mcMin(){const c=S.mc;return Math.floor((Date.now()-(c.end-c.dur))/c.ms)}

 <div class="c text-sm"><b>Дуэли</b><div style="opacity:.8">3–5 ситуаций за матч, 12 секунд на выбор. Шанс гола = база ситуации (1 на 1 — 60%, удар с 22 м — 25%, пенальти — 78%…) + разница рейтингов × 1.5% − 30%, если защита угадала. Защищающийся может 1 раз за матч запросить VAR: после короткой проверки гол отменят в 20% случаев, в 80% — засчитают.</div></div>
 <div class="c text-sm"><b>Аукцион</b><div style="opacity:.8">Пул = менеджеры × состав. Общий таймер аукциона (10–30 мин, задаёт хост), 7 с на ход, 5 с после ставки. Пока идёт таймер, покупать может любой с монетами — даже в одиночку по стартовой цене. Trade-in: ставка + игрок в залог (OVR 70–79 → +1, 80–85 → +2, 86+ → +4): перебили — игрок вернётся, выиграли — уйдёт и освободит слот (так можно торговаться и с полным составом). Таймер кончился или все набраны — пустые места займут свободные агенты (64–70). Кнопка «Завершить аукцион (Сохранить бюджет)» выводит вас из торгов: пустые места сразу займут свободные агенты, монеты останутся на трансферный рынок и следующий сезон; когда закончат все — драфт завершается досрочно. Затем аукцион домашних стадионов (старт 1 монета).</div></div>
 <div class="c text-sm"><b>🔥 Интенсивность</b><div style="opacity:.8">Усталости нет. Высокая интенсивность: +15% к созданию моментов, но травмы в 2,5 раза чаще. Низкая: −8% моментов, травмы вдвое реже.</div></div>
 <div class="c text-sm"><b>⚙️ Стиль игры</b><div style="opacity:.8">«Состав» → Options: Автобус, Контратаки, Контроль мяча, Прессинг, Силовой навал, Баланс + интенсивность. Стиль не под состав (например, «Автобус» с топ-атакой и слабой защитой) — −10% к эффективности. Против философии тренера — −5 к скрытой силе. Состав и тренер под стиль — +15% к реализации моментов.</div></div>
 <div class="c text-sm"><b>🏟 Форматы</b><div style="opacity:.8">Одна лига · «Восток + Север» (конференции, затем разделение на Чемпионскую и Вторую группы с обнулением очков) · Два дивизиона с вылетом и повышением (в Первой лиге банк ${BASE2} и призы ${PRIZE2.join('/')}).</div></div>
 <div class="c text-sm"><b>👋 Конец карьеры</b><div style="opacity:.8">В межсезонье игроки от 34 лет могут завершить карьеру: 34 — 15%, 35 — 35%, 36 — 60%, 37 — 80%, 38 — всегда. Клуб получает 1–2 монеты. «Легенды» играют вечно.</div></div>
 <div class="c text-sm"><b>🌍 Еврокубки и суперкубки</b><div style="opacity:.8">Со 2-го сезона по итогам прошлого: 8–9 менеджеров — ЛЧ (1–4 места); 10–11 — + ЛЕ (5–8); 12–15 — + ЛК (9–12); от 16 — ЛЧ 1–8 (две группы и полуфиналы), ЛЕ, ЛК. Группы по 4, дома и в гостях, потом финал. ЛЧ: +1 за победу в группе, +3 финалистам, +8 победителю; ЛЕ +5, ЛК +3 победителю. Перед сезоном — Суперкубок (чемпион против обладателя Кубка) и Суперкубок Европы (победители ЛЧ и ЛЕ), +3 победителю. В формате «Восток + Север» перед разделением — Финал конференций (+3).</div></div>
 <div class="c text-sm"><b>📦 Тайник</b><div style="opacity:.8">На аукционе всегда один игрок на лот. Раз в 8–10 лотов выставляется тайник: видна только позиция, имя и рейтинг скрыты до удара молотка. Обычные торги по очереди, старт 2 монеты. Кто внутри: 90+ — 5%, 86–89 — 15%, 81–85 — 50%, 71–80 — 20%, до 70 — 10%.</div></div>
 <div class="c text-sm"><b>🥅 Серия пенальти в Кубке</b><div style="opacity:.8">Ничья в кубковом матче — менеджеры сами бьют пенальти: бьют по очереди, как в настоящей серии: «Вы бьёте» — выбираете угол, «Вы ловите» — выбираете прыжок (5 с). Не угадал вратарь — почти всегда гол, угадал — чаще сейв. По 5 ударов, потом до первой ошибки.</div></div>
 <div class="c text-sm"><b>⏸ Пауза без интернета</b><div style="opacity:.8">Если у хоста пропал интернет (или он свернул игру), игра у всех встаёт на паузу: таймеры замирают и продолжаются с того же места, когда хост вернётся.</div></div>
 <div class="c text-sm"><b>📊 Досье игрока</b><div style="opacity:.8">Нажмите на карточку игрока (на поле — дважды): фото, клуб, стиль и радар PAC / SHO / PAS / DRI / DEF / PHY.</div></div>
 <div class="c text-sm"><b>🔥 В огне</b><div style="opacity:.8">2 победы подряд и больше — у клуба горит значок пламени в таблице и в матчах тура.</div></div>
 <div class="c text-sm"><b>👑 Капитан</b><div style="opacity:.8">Перед аукционами каждый покупает капитана из 6 персональных кандидатов по фиксированной цене: OVR 80–83 — 3 💰, 77–79 — 2 💰, 70–75 — 1 💰.</div></div>
 <div class="c text-sm"><b>🏦 Кредит и FFP</b><div style="opacity:.8">Займ +5 или +10 берётся только на экране аукциона, долг не больше 30. В конце сезона игра предложит погасить долг. Не погашен к межсезонью — трансферный бан; к новому сезону — −3 / −5 / −7 / −10 / −15 очков (долг до 5 / 10 / 15 / 20 / 30).</div></div>
 <div class="c text-sm"><b>💰 Бюджет на новый сезон</b><div style="opacity:.8">Несгораемый банк +10 каждому. Лига: 🥇 +10, 🥈 +6, 🥉 +3. 🏆 Кубок +10. 👟 Лучший бомбардир, 🎯 ассистент и 🧤 вратарь (сухие матчи) — +2 клубу игрока. Непотраченные монеты сохраняются.</div></div>
 <div class="c text-sm"><b>🟥 Карточки и дисквалификации</b><div style="opacity:.8">Удаления редкие. Вторая жёлтая (или срыв атаки «Топором») — пропуск 1 матча, прямая красная за грубый фол — 2–3 матча. Дисквалифицированный помечен 🟥 и не может выйти в старте.</div></div>
 <div class="c text-sm"><b>⏱ Паузы между турами</b><div style="opacity:.8">Обычно 30 секунд, каждые 5 туров — большое трансферное окно на 2:00. «Все готовы» запускает тур сразу.</div></div>
 <div class="c text-sm"><b>🥤 Битва за колу 0.33L</b><div style="opacity:.8">${colaRules(S.M.length)} Баланс банок копится от сезона к сезону — смотрите «Долговую книгу колы».</div></div>
