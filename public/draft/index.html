function sqV(){const m=me(),F=FM[m.fm];let k=0;const nat=slots(m.fm).filter((s,i)=>S.P[m.xi[i]].p==s).length,dm=Math.round(nat/11*5),o=ovr(m),st=Math.max(1,Math.min(5,Math.round((o-60)/6))),co=CO.find(c=>c[0]==m.coach)||['—','','',''];
 const sl=F.map((r,i)=>r.map((_,j)=>{const idx=k++,x=(j+1)*100/(r.length+1),y=8+i*(80/(F.length-1));return`<div class="sl ${SEL&&SEL.t=='x'&&SEL.i==idx?'sel':''}" style="left:${x}%;bottom:${y}%" onclick="pickX(${idx})">${gc(m.xi[idx])}</div>`}).join('')).join('');
 const bench=m.sq.filter(id=>!m.xi.includes(id));
 return`<div class="flex justify-between items-center text-sm"><button class="px-3 py-2 rounded-lg bg-zinc-800 font-bold" onclick="FMO=true;R()">${m.fm} ▾</button><div class="text-center"><div class="text-yellow-400">${'★'.repeat(st)}${'☆'.repeat(5-st)}</div><b>OVR ${o}</b></div><div class="text-emerald-400">${'◆'.repeat(dm)}${'◇'.repeat(5-dm)}</div><div>💰 <b>${m.coins}</b></div></div>
 <div class="pitch mt-2">${sl}<div class="c" style="position:absolute;left:6px;top:4px;z-index:3;width:76px;margin:0;padding:4px;text-align:center;background:#000a"><div class="text-2xl">${co[1]}</div><b class="text-xs">${co[0]}</b><div class="text-[9px] text-emerald-300">${co[3]||''}</div><div class="flex justify-center mt-1">${crest(m.club)}</div></div></div>
 <div class="text-sm mt-3 font-bold">Скамейка (${bench.length})</div><div class="flex gap-2 overflow-x-auto py-2">${bench.map(id=>`<div class="${SEL&&SEL.t=='b'&&SEL.id==id?'sel':''}" onclick="pickB(${id})" style="flex:none">${gc(id)}</div>`).join('')}</div><div class="text-xs opacity-60">Нажмите игрока основы, затем запасного (или другого игрока основы) — они поменяются местами.</div>`}
function pickX(i){const m=me();if(!SEL)SEL={t:'x',i};else if(SEL.t=='x'){const x=m.xi.slice();[x[i],x[SEL.i]]=[x[SEL.i],x[i]];SEL=null;send({a:'xi',xi:x})}else{const x=m.xi.slice();x[i]=SEL.id;SEL=null;send({a:'xi',xi:x})}R()}
function pickB(id){const m=me();if(SEL&&SEL.t=='x'){const x=m.xi.slice();x[SEL.i]=id;SEL=null;send({a:'xi',xi:x})}else SEL={t:'b',id};R()}
function fmV(){return`<div class="ov"><h2>Выбор схемы</h2><div class="grid grid-cols-3 gap-2">${Object.keys(FM).map(f=>`<button class="c" onclick="FMO=false;send({a:'fm',f:'${f}'})"><div class="mini">${dots(f).map(d=>`<i style="left:${d[0]}%;bottom:${d[1]}%"></i>`).join('')}</div><b class="text-sm">${f}</b></button>`).join('')}</div>${btn('Закрыть',"FMO=false;R()",'g')}</div>`}
const table=()=>S.M.map((m,i)=>({m,i,p:m.st[1]*3+m.st[2]})).sort((a,b)=>b.p-a.p||(b.m.st[4]-b.m.st[5])-(a.m.st[4]-a.m.st[5])||b.m.st[4]-a.m.st[4]);
function tabV(){return`<h2>Турнирная таблица</h2><div class="c text-xs overflow-x-auto"><table class="w-full" style="min-width:330px"><tr class="opacity-60"><td>#</td><td></td><td>Клуб</td><td>И</td><td>В</td><td>Н</td><td>П</td><td>З</td><td>П</td><td>РМ</td><td>О</td></tr>${table().map((x,k)=>{const s=x.m.st;return`<tr class="${x.m.pid==ME?'text-yellow-300':''}"><td>${k+1}</td><td>${crest(x.m.club)}</td><td>${esc(x.m.club)}</td><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${s[5]}</td><td>${s[4]-s[5]}</td><td><b>${x.p}</b></td></tr>`}).join('')}</table></div>
 ${(()=>{const P=S.M.flatMap(m=>m.sq.map(id=>({p:S.P[id],c:m.club}))),top=(k,f)=>P.filter(x=>x.p[k]>0&&(!f||x.p.p=='G')).sort((a,b)=>b.p[k]-a.p[k]).slice(0,5).map(x=>`<div class="flex justify-between"><span>${esc(x.p.n)} <span class="opacity-60">${esc(x.c)}</span></span><b>${x.p[k]}</b></div>`).join('')||'—';return`<div class="c"><b>👟 Золотая бутса</b>${top('gl')}</div><div class="c"><b>🎯 Ассистенты</b>${top('as')}</div><div class="c"><b>🧤 Лучшие вратари (сухие матчи)</b>${top('cs',1)}</div>`})()}`}
function rdV(){const fin=S.ph=='end',ch=table()[0];return`${fin?`<div class="c text-center"><div class="text-6xl">🏆</div><h2>Чемпион: ${esc(ch.m.club)}</h2><b>${esc(ch.m.n)}</b></div>`:`<h2>Тур ${S.rd+1} из ${S.fx.length}</h2>${S.fx[S.rd].map(([h,a])=>`<div class="c flex items-center justify-between text-sm"><span>${crest(S.M[h].club)} ${esc(S.M[h].club)}</span><b>vs</b><span>${esc(S.M[a].club)} ${crest(S.M[a].club)}</span></div>`).join('')}${S.evs.length?`<h2>События перед туром</h2>${S.evs.map(e=>`<div class="c text-sm">${esc(e)}</div>`).join('')}`:''}${btn('⚽ СИМУЛИРОВАТЬ ТУР',"send({a:'sim'})")}`}
 ${S.last.length?`<h2>Итоги ${fin?'последнего ':'прошлого '}тура</h2>${S.last.map(r=>`<details class="c"><summary class="flex justify-between"><span>${esc(S.M[r.h].club)}</span><b class="text-yellow-400">${r.ga}:${r.gb}</b><span>${esc(S.M[r.a].club)}</span></summary><div class="text-xs mt-2">${r.ev.map(e=>`<div>${esc(e)}</div>`).join('')}</div></details>`).join('')}`:''}`}
function trV(){const m=me(),o=S.M.filter(x=>x.pid!=ME);if(!o.length)return'';TR.f=Math.min(TR.f,o.length-1);const f=o[TR.f],opt=(a,v)=>a.map(id=>`<option value="${id}" ${id==v?'selected':''}>${esc(pl(id).n)} (${pl(id).o} ${POS[pl(id).p]})</option>`).join('');if(!m.sq.includes(+TR.g))TR.g=m.sq[0];if(!f.sq.includes(+TR.r))TR.r=f.sq[0];
 return`<h2>Обмен с друзьями</h2><div class="c">Клуб<select onchange="TR.f=+this.value;R()">${o.map((x,i)=>`<option value="${i}" ${i==TR.f?'selected':''}>${esc(x.club)} · ${esc(x.n)}</option>`).join('')}</select>Отдаю<select onchange="TR.g=+this.value">${opt(m.sq,+TR.g)}</select>Получаю<select onchange="TR.r=+this.value">${opt(f.sq,+TR.r)}</select>Моя доплата, монет<input type="number" min="0" value="${TR.c}" oninput="TR.c=+this.value||0">${btn('Отправить предложение',"send({a:'offer',to:'"+f.pid+"',g:+TR.g,r:+TR.r,c:TR.c})")}</div>${S.offers.filter(x=>x.from==ME).map(x=>`<div class="c text-sm">⏳ Ждёт ответа: ${esc(pl(x.g).n)}${x.c?' + '+x.c+'💰':''} за ${esc(pl(x.r).n)}</div>`).join('')}`}
function offerV(){const x=S.offers.find(o=>o.to==ME);if(!x)return'';const A=S.M[mi(x.from)];return`<div class="ov"><h2>Предложение обмена</h2><div class="c"><b>${esc(A.n)}</b> (${esc(A.club)}) отдаёт:${card(x.g)}${x.c?`<div class="text-center">+ ${x.c} 💰</div>`:''}за вашего:${card(x.r)}</div>${btn('Принять',`send({a:'resp',id:'${x.id}',ok:1})`,'v')}${btn('Отклонить',`send({a:'resp',id:'${x.id}',ok:0})`,'g')}</div>`}
function topV(){const on=isHost?(NET&&NET.up):(NET&&NET.up);return`<div class="top"><span class="dot" style="background:${on?'#10b981':'#ef4444'}"></span><span>Комната <b>${esc(CODE)}</b>${isHost?' · вы хост':''} · ${on?'онлайн':'нет связи…'}</span><button onclick="leave()">Выйти</button></div>${hostAway()?'<div class="warn">Хост не в сети — игра продолжится, когда он вернётся во вкладку с игрой.</div>':''}`}
function R(){const a=$('app'),n=$('nav'),ae=document.activeElement,fid=ae&&ae.id&&(ae.tagName=='INPUT'||ae.tagName=='SELECT')?ae.id:null,fv=fid?ae.value:null;
 const tz=TOAST?`<div class="toast">${esc(TOAST)}</div>`:'';
 if(!S){n.innerHTML='';a.innerHTML=homeV()+tz}
 else{let h='';const main=S.ph=='main'||S.ph=='end';
 if(!me()){n.innerHTML='';a.innerHTML=topV()+(S.ph=='lobby'?'<div class="c text-center mt-4">Входим в лобби…</div>':`<div class="c text-center mt-4">Игра в комнате ${esc(CODE)} уже началась без вас.${btn('На главную','leave()','g')}</div>`)+tz}
 else{if(S.ph=='lobby')h=lobbyV();else if(S.ph=='coach')h=coachV();else if(S.ph=='auc')h=aucV();else h={sq:sqV,rd:rdV,tab:tabV,tr:trV}[TAB]();
 a.innerHTML=topV()+h+(FMO&&main?fmV():'')+(main?offerV():'')+tz;
 n.innerHTML=main?`<div class="nav">${[['sq','📋','Состав'],['rd','⚽','Тур'],['tab','📊','Таблица'],['tr','🔁','Обмен']].map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';SEL=null;R()"><div class="text-lg">${t[1]}</div>${t[2]}</button>`).join('')}</div>`:''}}
 if(fid){const el=$(fid);if(el&&el!==document.activeElement){if(fv!=null&&el.tagName=='INPUT')el.value=fv;try{el.focus({preventScroll:true})}catch(e){}}}}
setInterval(()=>{if(S&&!isHost){const w=!!hostAway();if(w!=HBW){HBW=w;R()}}},1000);
setInterval(()=>{if(!S||S.ph!='auc'||!S.au||S.au.sold||!$('tm'))return;const l=Math.max(0,S.au.end-Date.now()),s=Math.ceil(l/1000);$('tm').textContent=s+' c';$('tm').style.color=s<=3?'#ef4444':'#fff';$('bar').style.width=Math.min(100,l/110)+'%';if(s<=3&&s>0&&s!=LT)sndTick();LT=s},150);
R();
</script></body></html>
