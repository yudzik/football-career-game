<style>:root{--bg:#0d1113;--fg:#e8eceb}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1113;--fg:#e8eceb}}:root[data-theme="dark"]{--bg:#0d1113;--fg:#e8eceb}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}

.c{background:#171d20;border:1px solid #28323a;border-radius:14px;padding:10px;margin-top:8px}
input,select{width:100%;background:#0d1113;border:1px solid #2f3a40;border-radius:10px;padding:10px;color:#fff;margin-top:4px;font-size:16px}
h2{font-size:1.2rem;font-weight:900;color:#d4a72c;margin-top:6px}
.pitch{position:relative;width:100%;padding-top:150%;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(0deg,#0f5c34 0 10%,#12683a 10% 20%);border:2px solid #1e8a52}
.pitch:before{content:"";position:absolute;inset:3%;border:2px solid #ffffff40;border-radius:6px}.pitch:after{content:"";position:absolute;left:30%;right:30%;top:43%;height:14%;border:2px solid #ffffff30;border-radius:50%}
.sl{position:absolute;transform:translate(-50%,50%);z-index:2}
.pc{position:relative;width:60px;height:82px;border-radius:9px 9px 18px 18px;color:#1a1400;font-size:9px;line-height:1.1;background:linear-gradient(165deg,var(--c) 0%,#fff8 38%,var(--c) 62%,#5c430a 100%);box-shadow:0 2px 6px #0009;overflow:hidden}
.pc .o{position:absolute;left:4px;top:3px;font-size:16px;font-weight:900}.pc .p{position:absolute;left:4px;top:20px;font-style:normal;font-weight:800;font-size:8px}
.pc .ph{position:absolute;right:-3px;top:3px;width:38px;height:42px;object-fit:contain;object-position:bottom}
.pc .nm{position:absolute;left:0;right:0;top:46px;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;padding:0 2px;font-size:9px}

.ut{position:relative;flex:none;width:128px;height:178px;border-radius:14px 14px 34px 34px;color:#1a1400;background:linear-gradient(160deg,var(--c) 0%,#fffb 36%,var(--c) 64%,#4a3608 100%);box-shadow:0 6px 18px #000a;overflow:hidden}

.ut .ph{position:absolute;right:-6px;top:10px;width:96px;height:104px;object-fit:contain;object-position:bottom}
.ut .nm{position:absolute;left:4px;right:4px;top:118px;text-align:center;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;border-top:1px solid #0003;padding-top:3px}
.ut .st{position:absolute;left:0;right:0;top:138px;text-align:center;font-size:10px;font-weight:800;opacity:.85}

function MQ(url){const te=new TextEncoder(),td=new TextDecoder(),cid='fd'+Math.random().toString(36).slice(2,12);

   if(ty==2){if(p[1]===0){o.up=true;retry=0;o.subs.forEach(t=>raw(subPk(t)));clearInterval(ping);ping=setInterval(()=>raw(Uint8Array.of(0xC0,0)),20000);o.onUp&&o.onUp()}else{try{ws.close()}catch(e){}}}

 if(others.length)h+=`<h2>Другие матчи</h2>${others.map(y=>`<div class="c">${sb(y)}${L.rev&&y.cur?`<div class="text-xs text-center mt-1" style="opacity:.7">${esc(y.ev[y.ev.length-1]||'')}</div>`:''}</div>`).join('')}`;
 return h}
function sumV(){const s=S.sum,ch=table()[0];return`<div class="c text-center" style="border-color:#d4a72c"><div class="text-6xl">🏆</div><div class="text-xs" style="opacity:.6">ИТОГИ СЕЗОНА ${s.s}</div><h2 style="font-size:1.6rem">${esc(ch.m.club)}</h2><div class="flex justify-center mt-1">${crest(ch.m.club)}</div><b>${esc(ch.m.n)} — чемпион!</b><div class="text-xs mt-2" style="opacity:.7">Призовые: 1 место +${PRIZE[0]}, 2 место +${PRIZE[1]}, 3 место +${PRIZE[2]}, Золотая бутса +${BOOT}. Всем клубам на новый сезон: +${S.cfg.stip} 💰</div></div>
 ${tableH(s.rows)}${awards()}${cabinet()}${hallV()}
 ${isHost?btn('Перейти к межсезонью →',"send({a:'next'})",'v'):'<div class="c text-center" style="opacity:.7">Ждём, пока хост откроет межсезонье…</div>'}`}
function offV(){const m=me(),rdy=S.ready.includes(ME),ids=m.sq.slice().sort((a,b)=>pl(b).o-pl(a).o);
 return`<h2>🔄 Межсезонье → Сезон ${S.season+1}</h2><div class="c text-sm">Оставьте бесплатно до <b>5</b> игроков — остальные вернутся на рынок. Молодые (до 23 лет) прибавят +1–2, ветераны (33+) потеряют 1–2. Сохранено: <b class="text-yellow-400">${m.keep.length}/5</b> · бюджет: <b>${m.coins} + ${S.cfg.stip}</b> 💰</div>
 ${ids.map(id=>{const p=pl(id),d=S.prog&&S.prog[id]||0,k=m.keep.includes(id);return card(id,`<button class="tag ${k?'ld':''}" style="padding:8px 10px" onclick="send({a:'keep',id:${id}})">${k?'✅ Оставлен':'Оставить'}</button>`).replace('</b><div',` <span style="color:${d>0?'#34d399':d<0?'#f87171':'#8a979d'}">${d>0?'↑ +'+d:d<0?'↓ '+d:'='}</span></b><div`)}).join('')}
 <div class="c"><div>${S.M.map(x=>`<span class="tag ${S.ready.includes(x.pid)?'ld':''}">${S.ready.includes(x.pid)?'✅':'⏳'} ${esc(x.n)} · ${x.keep.length}/5</span>`).join('')}</div><button class="b ${rdy?'g':'v'}" onclick="send({a:'ready'})">${rdy?'⏸ Ещё подумаю':'✅ Готов к новому сезону'}</button>${isHost?btn('Начать драфт сезона '+(S.season+1)+' →',"send({a:'next'})",'g'):''}</div>`}
function trV(){const m=me(),o=S.M.filter(x=>x.pid!=ME);if(!o.length)return'';TR.f=Math.min(TR.f,o.length-1);const f=o[TR.f],opt=(a,v)=>a.map(id=>`<option value="${id}" ${id==v?'selected':''}>${esc(pl(id).n)} (${pl(id).o} ${PN[pl(id).p]}${pl(id).out?' 🚑':''})</option>`).join('');if(!m.sq.includes(+TR.g))TR.g=m.sq[0];if(!f.sq.includes(+TR.r))TR.r=f.sq[0];
 return`<h2>Обмен с друзьями</h2><div class="c">Клуб<select onchange="TR.f=+this.value;R()">${o.map((x,i)=>`<option value="${i}" ${i==TR.f?'selected':''}>${esc(x.club)} · ${esc(x.n)}</option>`).join('')}</select>Отдаю<select onchange="TR.g=+this.value">${opt(m.sq,+TR.g)}</select>Получаю<select onchange="TR.r=+this.value">${opt(f.sq,+TR.r)}</select>Моя доплата, монет<input type="number" min="0" value="${TR.c}" oninput="TR.c=+this.value||0">${btn('Отправить предложение',"send({a:'offer',to:'"+f.pid+"',g:+TR.g,r:+TR.r,c:TR.c})")}</div>${S.offers.filter(x=>x.from==ME).map(x=>`<div class="c text-sm">⏳ Ждёт ответа: ${esc(pl(x.g).n)}${x.c?' + '+x.c+'💰':''} за ${esc(pl(x.r).n)}</div>`).join('')}`}
function offerV(){const x=S.offers.find(o=>o.to==ME);if(!x||S.live)return'';const A=S.M[mi(x.from)];return`<div class="ov"><div><h2>Предложение обмена</h2><div class="c"><b>${esc(A.n)}</b> (${esc(A.club)}) отдаёт:${card(x.g)}${x.c?`<div class="text-center">+ ${x.c} 💰</div>`:''}за вашего:${card(x.r)}</div>${btn('Принять',`send({a:'resp',id:'${x.id}',ok:1})`,'v')}${btn('Отклонить',`send({a:'resp',id:'${x.id}',ok:0})`,'g')}</div></div>`}
function menuV(){return`<div class="ov"><div><h2>Меню</h2><div class="c"><b>Комната ${esc(CODE)}</b>${isHost?' · вы хост':''} · сезон ${S.season}<button class="b" onclick="shareLink(this)">📨 Пригласить по ссылке</button></div>
 ${isHost?`<div class="c text-sm"><b>Режим матчей</b><div class="seg mt-2"><button class="${S.cfg.mode!='q'?'on':''}" onclick="send({a:'mode',v:'i'})">⚔️ Моменты</button><button class="${S.cfg.mode=='q'?'on':''}" onclick="send({a:'mode',v:'q'})">⚡ Мгновенно</button></div></div>`:`<div class="c text-sm">Режим матчей: <b>${S.cfg.mode=='q'?'⚡ мгновенная симуляция':'⚔️ интерактивные моменты'}</b></div>`}
 ${cabinet()}${hallV()}
 <div class="c text-sm"><b>Дуэли</b><div style="opacity:.8">В матче 3–5 моментов. Атакующий и защищающийся за 10 секунд выбирают действие. Угадала защита — гол маловероятен, но звезда против слабого защитника ещё может продавить момент. Не угадала — шанс зависит от рейтинга на позиции, сыгранности и тренеров.</div></div>
 <div class="c text-sm"><b>Позиции и сыгранность</b><div style="opacity:.8">Основная позиция — 100%, вторичная −4, чужая −30, вратарь в поле или полевой в воротах — 30. Сыгранность ◆ 0–3 на игрока (клуб 2/5/8, нация 2/5/8, лига 3/5/8, +1 от тренера), до 33 на команду, даёт до +7% силы.</div></div>
 <div class="c text-sm"><b>Аукцион</b><div style="opacity:.8">Ход по кругу: перебить или пас (15 с на ход). Старт: 89+ → 5, 85–88 → 4, 81–84 → 3, 76–80 → 2, ниже → 1.</div></div>
 ${btn('Закрыть',"MENU=false;R()",'v')}${btn('Выйти из комнаты',"MENU=false;leave()",'r')}${credits()}</div></div>`}
function topV(){const on=NET&&NET.up;return`<div class="top"><span class="dot" style="background:${on?'#10b981':'#ef4444'}"></span><span style="flex:1">Комната <b>${esc(CODE)}</b>${isHost?' · хост':''} · ${on?'онлайн':'нет связи…'}</span><button onclick="MENU=true;R()">☰ Меню</button></div>${hostAway()?'<div class="warn">Хост не в сети — игра продолжится, когда он вернётся во вкладку с игрой.</div>':''}`}
function R(){const a=$('app'),n=$('nav'),ae=document.activeElement,fid=ae&&ae.id&&(ae.tagName=='INPUT'||ae.tagName=='SELECT')?ae.id:null,fv=fid?ae.value:null;
 const tz=TOAST?`<div class="toast">${esc(TOAST)}</div>`:'';
 if(!S){n.innerHTML='';a.innerHTML=homeV()+tz}
 else{let h='';const main=S.ph=='main'&&!S.live;
 if(!me()){n.innerHTML='';a.innerHTML=topV()+(S.ph=='lobby'?'<div class="c text-center mt-4">Входим в лобби…</div>':`<div class="c text-center mt-4">Игра в комнате ${esc(CODE)} уже началась без вас.${btn('На главную','leave()','g')}</div>`)+(MENU?menuV():'')+tz}
 else{if(S.ph=='lobby')h=lobbyV();else if(S.ph=='cauc'||S.ph=='auc')h=aucV();else if(S.ph=='sum')h=sumV();else if(S.ph=='off')h=offV();else if(S.live)h=liveV();else h={sq:sqV,rd:rdV,tab:tabV,tr:trV}[TAB]();
 a.innerHTML=topV()+h+(FMO&&['cauc','auc','main'].includes(S.ph)&&!S.live?fmV():'')+(main?offerV():'')+(MENU?menuV():'')+tz;
 n.innerHTML=main?`<div class="nav">${[['sq','📋','Состав'],['rd','⚽','Тур'],['tab','📊','Таблица'],['tr','🔁','Обмен']].map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';SEL=null;R()"><div class="text-lg">${t[1]}</div>${t[2]}</button>`).join('')}</div>`:''}}
 if(fid){const el=$(fid);if(el&&el!==document.activeElement){if(fv!=null&&el.tagName=='INPUT')el.value=fv;try{el.focus({preventScroll:true})}catch(e){}}}}
setInterval(()=>{if(!S)return;const n=Date.now(),L=S.live;
 if(S.au&&!S.au.sold&&$('tm')){const l=Math.max(0,S.au.end-n),s=Math.ceil(l/1000);$('tm').textContent=s+' с';$('tm').style.color=s<=3?'#ef4444':'';$('bar').style.width=Math.min(100,l/TURN*100)+'%';if(s<=3&&s>0&&s!=TKS&&S.au.turn==ME)sndTick();TKS=s}
 if(S.ph=='main'&&!L&&S.prepEnd&&$('pt')){const l=Math.max(0,S.prepEnd-n),s=Math.ceil(l/1000);$('pt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('pt').style.color=s<=10?'#ef4444':'';$('pbar').style.width=Math.min(100,l/(S.cfg.prep*10))+'%'}
 if(L&&$('lt')){const tot=L.rev?REVEAL:DUEL,l=Math.max(0,(L.rev?L.revEnd:L.end)-n),s=Math.ceil(l/1000);$('lt').textContent=L.rev?'дальше через '+s+' с':s+' с';$('lt').style.color=!L.rev&&s<=3?'#ef4444':'';$('lbar').style.width=Math.min(100,l/tot*100)+'%';if(!L.rev&&s<=3&&s>0&&s!=TKS&&myMatch())sndTick();TKS=s}},200);
setInterval(()=>{if(S&&!isHost){const w=!!hostAway();if(w!=HBW){HBW=w;R()}}},1000);
R();
</script></body></html>
