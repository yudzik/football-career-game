name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_PAGES: 'true'
        run: npm run build

      # Do NOT add `enablement: true` here to auto-create the Pages site — it was tried and
      # fails with "Create Pages site failed. Error: Resource not accessible by integration",
      # because creating a Pages site needs repository-administration rights that the
      # workflow's GITHUB_TOKEN does not have, whatever `permissions:` requests.
      # The site has to be turned on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
