name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # the photo pack is committed by a bot, which does not trigger «push» — deploy after it instead
  workflow_run:
    workflows: ['Draft photo pack']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_PAGES: 'true'
        run: npm run build

      # FC Draft Online: the photo pack as one archive for the hotspot mode (local-server.js serves ./ph/)
      - name: Draft photo archive
        run: if [ -d dist/draft/ph ]; then cd dist/draft && zip -qr ph.zip ph; fi

      # enablement provisions the Pages site itself when the repository has none, instead of
      # failing with "Get Pages site failed ... Not Found" and requiring a trip to Settings.
      # It still cannot create a site the repository is not entitled to: Pages on a private
      # repository needs a paid plan, so on the free plan the repository must be public.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
